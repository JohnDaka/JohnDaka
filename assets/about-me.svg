<svg viewBox="0 0 860 714" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
<title id="t">About Ivan Daka</title>
<desc id="d">Career timeline, newest first: AI and Web3 exchange (2024 - now), Arkis (2023 - 2024), DreamWorks Animation (2020 - 2023), Luxoft (2019 - 2020), Software MacKiev / LogicManager (2016 - 2019), AdKernel (2015 - 2016), Squarespace (2014 - 2015), Deutsche Bank (2013 - 2014).</desc>
<defs>
  <radialGradient id="glow" cx="50%" cy="0%" r="70%">
    <stop offset="0%" stop-color="#0897f7" stop-opacity=".16"/>
    <stop offset="100%" stop-color="#0897f7" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="rail" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#ffffff" stop-opacity=".7"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity=".08"/>
  </linearGradient>
  <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
    <stop offset="50%" stop-color="#ffffff" stop-opacity=".14"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>
  <filter id="soft" x="-200%" y="-200%" width="500%" height="500%">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="halo" x="-20%" y="-80%" width="140%" height="260%">
    <feGaussianBlur stdDeviation="4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <style>
    .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    .year { font-size: 12px; fill: #8b8fa8; }
    .now { fill: #e7e7f2; }
    .co { font-size: 15px; font-weight: 600; fill: #ffffff; }
    .role { font-size: 12.5px; }
    .sep { fill: #4a4d66; }
    .detail { font-size: 12px; fill: #8b8fa8; }
    .focus { font-size: 12.5px; fill: #c7c9ea; }
    /* The node of the job I am in now breathes; every other node is still. */
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-out infinite; }
    @keyframes pulse { 0% { transform: scale(1); opacity: .65; } 100% { transform: scale(2.8); opacity: 0; } }
  </style>
</defs>

<rect x=".5" y=".5" width="859" height="713" rx="14" fill="#00030a" stroke="#1c2030"/>
<rect x=".5" y=".5" width="859" height="713" rx="14" fill="url(#glow)"/>

